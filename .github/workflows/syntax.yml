name: tests

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install dev dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Node syntax
        run: |
          node --check server.mjs
          node --check public/app.js
          node --check public/sw.js
          node --check public/core/format.js
          node --check public/core/markdown.js
          node --check public/core/sources.js
          node --check public/core/export.js
          node --check public/state.js
          node --check public/features.js
          Get-ChildItem public/features -Filter *.js | ForEach-Object { node --check $_.FullName }
          Get-ChildItem lib -Filter *.mjs | ForEach-Object { node --check $_.FullName }
          Get-ChildItem routes -Filter *.mjs | ForEach-Object { node --check $_.FullName }
          node --check test/test_ui_smoke.mjs
          node --check test/test_geogebra_smoke.mjs
          node --check test/test_instance_lock.mjs
          node --check test/test_xss.mjs
          node --check test/test_conversation_switch.mjs
          node --check scripts/package-release.mjs
          node --check scripts/restore-backup.mjs
          node --check test/test_agent.mjs
          node --check test/test_hardening.mjs
          node --check test/test_restore.mjs
          node --check test/test_chat_service.mjs
          node --check test/test_observability.mjs
          node --check test/test_provider_fallback.mjs
          node --check test/test_session_corrupt.mjs
          node --check test/test_modules.mjs
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Python dependencies
        run: python -m pip install --disable-pip-version-check sympy
      - name: Node tests (modules + agent + parsers + security + lock)
        run: |
          node test/test_modules.mjs
          node test/test_agent.mjs
          node test/test_chat_service.mjs
          node test/test_observability.mjs
          node test/test_provider_fallback.mjs
          node test/test_session_corrupt.mjs
          node test/test_flashparse.mjs
          node test/test_quizparse.mjs
          node test/test_server_security.mjs
          node test/test_instance_lock.mjs
          node test/test_hardening.mjs
          node test/test_restore.mjs
      - name: Browser dependency
        run: npm install --no-save --no-package-lock puppeteer-core
      - name: Browser smoke (no API key)
        run: node test/test_ui_smoke.mjs
      - name: Browser XSS regression (no API key)
        run: node test/test_xss.mjs
      - name: Browser conversation switch (no API key)
        run: node test/test_conversation_switch.mjs
      - name: GeoGebra rebuild smoke
        run: node test/test_geogebra_smoke.mjs
      - name: Math eval (SymPy)
        run: npm run eval
      - name: Launcher check
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\start-mathapp.ps1 -Check
      - name: Python syntax
        run: python -m py_compile sympy_cli.py extract.py transcribe.py test/test_sympy_cli.py
      - name: Python tests
        run: python test/test_sympy_cli.py -v