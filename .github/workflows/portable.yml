name: portable

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: ['18', '20', '22']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Python dependencies
        run: python -m pip install --disable-pip-version-check sympy pypdf
      - name: Dev dependencies
        run: npm ci
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: Docs and paths
        run: npm run check:docs
      - name: Node syntax
        run: |
          node --check server.mjs
          node --check public/app.js
          node --check public/state.js
          node --check public/features.js
          find public/features -name '*.js' -print0 | xargs -0 -n1 node --check
          find lib routes test scripts -name '*.mjs' -print0 | xargs -0 -n1 node --check
      - name: Node tests + coverage
        run: npm run coverage
      - name: Server cancellation
        run: node test/test_server_cancel.mjs
      - name: Browser dependency
        run: npm install --no-save --no-package-lock puppeteer-core
      - name: Browser smoke
        run: npm run test:ui
      - name: Coverage summary artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-node-${{ matrix.node-version }}
          path: coverage/coverage-summary.json
          if-no-files-found: warn
      - name: Math eval
        run: npm run eval
      - name: Python tests
        run: npm run test:py
