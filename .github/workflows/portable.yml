name: portable

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: ['18', '20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python dependencies
        run: python -m pip install --disable-pip-version-check sympy pypdf
      - name: Docs and paths
        run: npm run check:docs
      - name: Node syntax
        run: |
          node --check server.mjs
          node --check public/app.js
          node --check public/state.js
          node --check public/features.js
          find public/features -name '*.js' -print0 | xargs -0 -n1 node --check
          find lib routes test scripts -name '*.mjs' -print0 | xargs -0 -n1 node --check
      - name: Node tests
        run: npm test
      - name: Server cancellation
        run: node test/test_server_cancel.mjs
      - name: Math eval
        run: npm run eval
      - name: Python tests
        run: npm run test:py
