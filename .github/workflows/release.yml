name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release (e.g. v1.27.0)'
        required: true

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Check tag matches package version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.event.inputs.tag || github.ref_name }}") {
            throw "Tag ${{ github.event.inputs.tag || github.ref_name }} does not match package version v$version"
          }
      - name: Install dev dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Node tests
        run: npm test
      - name: Browser dependency
        run: npm install --no-save --no-package-lock puppeteer-core
      - name: Browser smoke
        run: npm run test:ui
      - name: Browser XSS regression
        run: npm run test:xss
      - name: Conversation switch regression
        run: npm run test:switch
      - name: GeoGebra smoke
        run: npm run test:geo
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Python dependencies
        run: python -m pip install --disable-pip-version-check sympy
      - name: Math eval
        run: npm run eval
      - name: Python tests
        run: python test/test_sympy_cli.py -v
      - name: Build source archive
        run: npm run package
      - name: Upload release asset
        uses: actions/upload-artifact@v7
        with:
          name: mathapp-release
          path: release/*.zip
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: mathapp-release
          path: release
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          tag="${RELEASE_TAG}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "$tag" --notes "See CHANGELOG.md for details."
          fi
          gh release upload "$tag" release/*.zip --clobber
